name: Temporary webOS 1.1.2 Build

on:
  push:
    branches:
      - release/v1.1.2-fork-pages

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare hosted app
        run: npm run hosted:prepare
      - name: Lint
        run: npm run lint
      - name: Build IPK
        run: npm run webos:package
      - name: Generate Homebrew artifacts
        run: npm run release:artifacts
      - name: Upload IPK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: SmartTwitchWebOSTV-v1.1.2
          path: |
            build/*.ipk
            build/*.manifest.json
            build/*.apps-repo.yml
          if-no-files-found: error
          retention-days: 7
