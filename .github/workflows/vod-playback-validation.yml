name: Temporary VOD Playback Fix Validation

on:
  push:
    branches:
      - fix/vod-enhanced-broadcasting-playback

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare hosted artifact
        run: npm run hosted:prepare

      - name: Run lint checks
        run: npm run lint

      - name: Build webOS package
        run: npm run webos:package
